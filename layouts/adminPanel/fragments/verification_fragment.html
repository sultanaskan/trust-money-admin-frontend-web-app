<div class="currency-page verification-page">
    <header class="page-header">
        <h1>🆔 User Verification Management</h1>
        <button class="add-currency-btn" id="toggleUploadForm">
            ➕ Upload New Document
        </button>
    </header>

    <!-- UPLOAD FORM -->
    <section class="form-section" id="verificationForm" style="display: none;">
        <h3>➕ Upload Verification Document</h3>

        <div class="form-group">
            <label>User ID</label>
            <input type="number" id="vUserId" placeholder="e.g. 10">
        </div>

        <div class="form-group">
            <label>Document Type</label>
            <select id="vDocType">
                <option value="nid">NID Card</option>
                <option value="passport">Passport</option>
                <option value="driving_licence">Driving License</option>
            </select>
        </div>

        <div class="form-group">
            <label>ID Number</label>
            <input type="text" id="vDocNumber" placeholder="Enter ID/Passport Number">
        </div>

        <div class="form-group">
            <label>Front Part Image</label>
            <input type="file" id="vFrontImg" accept="image/*">
        </div>

        <div class="form-group">
            <label>Back Part Image (Optional)</label>
            <input type="file" id="vBackImg" accept="image/*">
        </div>

        <div class="form-actions">
            <button id="submitVerification">✅ Upload & Submit</button>
            <button type="button" id="cancelVerification">❌ Cancel</button>
        </div>
    </section>

    <!-- PENDING LIST TABLE -->
    <section class="table-section">
        <h3>⏳ Pending Requests</h3>
        <table class="currency-table">
            <thead>
                <tr>
                    <th>User</th>
                    <th>Doc Type</th>
                    <th>ID Number</th>
                    <th>Images</th>
                    <th>Status</th>
                    <th colspan="2">Actions</th>
                </tr>
            </thead>
            <tbody id="verificationTableBody">
                <!-- Dynamic rows -->
            </tbody>
        </table>
    </section>
</div>

<!-- IMAGE PREVIEW MODAL (Optional) -->
<div id="imageModal"
    style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:10000; justify-content:center; align-items:center;">
    <div style="background:#fff; padding:10px; border-radius:8px; position:relative;">
        <span id="closeModal"
            style="position:absolute; top:-10px; right:-10px; background:red; color:#fff; cursor:pointer; padding:5px 10px; border-radius:50%;">X</span>
        <img id="modalImg" src="" style="max-width:80vw; max-height:80vh;">
    </div>
</div>
