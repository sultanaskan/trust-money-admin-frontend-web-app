<div class="currency-page">

    <!-- HEADER -->
    <header class="page-header">
        <h1>💳 Transaction Management</h1>

        <div class="header-actions">
            <button id="addTxnBtn">➕ New Transaction</button>
        </div>
    </header>

    <!-- FILTER SECTION -->
    <section class="form-section">
        <h3>🔍 Filter Transactions</h3>

        <div class="form-group">
            <label>User ID</label>
            <input type="number" id="filterUserId" placeholder="Enter user id">
        </div>

        <div class="form-group">
            <label>Status</label>
            <select id="filterStatus">
                <option value="">All</option>
                <option value="pending">Pending</option>
                <option value="success">Success</option>
                <option value="failed">Failed</option>
                <option value="cancelled">Cancelled</option>
            </select>
        </div>

        <div class="form-actions">
            <button id="applyFilter">Apply</button>
            <button id="resetFilter">Reset</button>
        </div>
    </section>

    <!-- ADD TRANSACTION -->
    <section class="form-section" id="txnForm" style="display:none;">
        <h3>➕ Create Transaction</h3>

        <div class="form-group">
            <label>User ID</label>
            <input type="number" id="txnUserId">
        </div>

        <div class="form-group">
            <label>Type</label>
            <select id="txnType">
                <option value="deposit">Deposit</option>
                <option value="withdraw">Withdraw</option>
                <option value="transfer">Transfer</option>
                <option value="payment">Payment</option>
            </select>
        </div>

        <div class="form-group">
            <label>Amount</label>
            <input type="number" id="txnAmount">
        </div>

        <div class="form-group">
            <label>Description</label>
            <input type="text" id="txnDesc">
        </div>

        <div class="form-actions">
            <button id="submitTxn">Submit</button>
            <button id="cancelTxn">Cancel</button>
        </div>
    </section>

    <!-- TABLE -->
    <section class="table-section">
        <table class="currency-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>User</th>
                    <th>Type</th>
                    <th>Amount</th>
                    <th>Status</th>
                    <th>Description</th>
                    <th>Date</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="txnTableBody"></tbody>
        </table>
    </section>

</div>
