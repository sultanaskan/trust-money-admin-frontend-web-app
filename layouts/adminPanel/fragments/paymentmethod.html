<div class="payment-page">
    <header class="page-header">
        <h1>💳 Payment Methods</h1>
        <button class="add-btn" id="addPaymentBtn">➕ Add Payment Method</button>
    </header>

    <section class="form-section" id="paymentForm"
        style="display:none; border: 1px solid #ddd; padding: 25px; margin-bottom: 20px; border-radius: 12px; background: #fff;">
        <h3 id="formTitle" style="margin-top: 0;">➕ Create Payment Method</h3>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
            <div class="form-group">
                <label style="display:block; font-weight:bold; margin-bottom:5px;">Method Type</label>
                <select id="methodType" style="width:100%; padding:10px; border:1px solid #ccc; border-radius:5px;">
                    <option value="">Select Type</option>
                    <option value="mobile">Mobile (Bkash/Nagad)</option>
                    <option value="banking">Traditional Banking</option>
                </select>
            </div>

            <div class="form-group">
                <label style="display:block; font-weight:bold; margin-bottom:5px;">Provider Name</label>
                <input type="text" id="providerName" placeholder="e.g. Bkash, DBBL, City Bank"
                    style="width:100%; padding:10px; border:1px solid #ccc; border-radius:5px;">
            </div>

            <div class="form-group">
                <label style="display:block; font-weight:bold; margin-bottom:5px;">Bank/Provider Logo</label>
                <input type="file" id="bankLogo" accept="image/*" style="width:100%; padding:8px;">
            </div>

            <div class="form-group">
                <label style="display:block; font-weight:bold; margin-bottom:5px;">Account Number</label>
                <input type="text" id="accountNumber" placeholder="017XXXXXXXX / Account No"
                    style="width:100%; padding:10px; border:1px solid #ccc; border-radius:5px;">
            </div>

            <div class="form-group">
                <label style="display:block; font-weight:bold; margin-bottom:5px;">Account Type</label>
                <select id="accountType" style="width:100%; padding:10px; border:1px solid #ccc; border-radius:5px;">
                    <option value="personal">Personal</option>
                    <option value="agent">Agent</option>
                    <option value="saving">Saving</option>
                </select>
            </div>

            <div class="form-group">
                <label style="display:block; font-weight:bold; margin-bottom:5px;">Status</label>
                <select id="status" style="width:100%; padding:10px; border:1px solid #ccc; border-radius:5px;">
                    <option value="active">Active</option>
                    <option value="inactive">Inactive</option>
                </select>
            </div>
        </div>

        <div class="form-group" style="margin-top: 15px;">
            <label style="display:block; font-weight:bold; margin-bottom:5px;">Payment Guide</label>
            <textarea id="paymentGuide" placeholder="Instruction for the user on how to pay..."
                style="width:100%; padding:10px; border:1px solid #ccc; border-radius:5px; height: 80px;"></textarea>
        </div>

        <div class="form-actions" style="margin-top: 20px; display: flex; gap: 10px;">
            <button id="submitPayment"
                style="background: #28a745; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">✅
                Submit</button>
            <button type="button" id="cancelPayment"
                style="background: #6c757d; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer;">❌
                Cancel</button>
        </div>
    </section>

    <section class="table-section" style="background:#fff; border-radius:8px; border:1px solid #eee; overflow: hidden;">
        <table class="payment-table" width="100%" style="border-collapse: collapse; text-align: left;">
            <thead>
                <tr style="background: #f8f9fa; border-bottom: 2px solid #eee;">
                    <th style="padding: 15px;">Logo</th>
                    <th>Provider</th>
                    <th>Type</th>
                    <th>Account Info</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="paymentTableBody"></tbody>
        </table>
    </section>
</div>
