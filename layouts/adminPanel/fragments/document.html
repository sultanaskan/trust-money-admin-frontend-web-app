<div class="document-page">

    <!-- HEADER -->
    <header class="page-header">
        <h1>📁 Company Documents</h1>
        <button id="addDocBtn" class="add-btn">➕ Upload Document</button>
    </header>

    <!-- UPLOAD FORM -->
    <section class="form-section" id="docForm" style="display:none;">
        <h3>📤 Upload New Document</h3>

        <div class="form-group">
            <label>Document File</label>
            <input type="file" id="docFile" />
        </div>

        <div class="form-group">
            <label>Title</label>
            <input type="text" id="docTitle" placeholder="Enter title" />
        </div>

        <div class="form-group">
            <label>Type</label>
            <input type="text" id="docType" placeholder="pdf / image / doc" />
        </div>

        <div class="form-group">
            <label>Description</label>
            <textarea id="docDesc" placeholder="Description"></textarea>
        </div>

        <div class="form-actions">
            <button id="submitDoc">Submit</button>
            <button id="cancelDoc" type="button">Cancel</button>
        </div>
    </section>

    <!-- TABLE -->
    <section class="table-section">
        <table class="doc-table">
            <thead>
                <tr>
                    <th>Title</th>
                    <th>Type</th>
                    <th>Description</th>
                    <th>File</th>
                    <th>Update</th>
                    <th>Delete</th>
                </tr>
            </thead>

            <tbody id="docTableBody"></tbody>
        </table>
    </section>

</div>
