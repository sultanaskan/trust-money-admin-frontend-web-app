<div class="notification-page">
    <header class="page-header">
        <h1>🔔 Notification Management</h1>
        <button class="add-btn" id="addNotifyBtn">
            ➕ Create New Notification
        </button>
    </header>

    <!-- ADD FORM SECTION -->
    <section class="form-section" id="notifyFormSection" style="display: none;">
        <h3>➕ Send Notification</h3>

        <div class="form-group">
            <label>User ID (Leave empty for Public Notice)</label>
            <input type="number" id="targetUserId" placeholder="e.g. 10 or empty">
        </div>

        <div class="form-group">
            <label>Title</label>
            <input type="text" id="notifyTitle" placeholder="e.g. New Offer!">
        </div>

        <div class="form-group">
            <label>Message</label>
            <textarea id="notifyMessage" rows="3" placeholder="Write notification content..."></textarea>
        </div>

        <div class="form-actions">
            <button id="submitNotify">🚀 Send Notification</button>
            <button type="button" id="cancelNotify">❌ Cancel</button>
        </div>
    </section>

    <!-- NOTIFICATION TABLE -->
    <section class="table-section">
        <table class="data-table">
            <thead>
                <tr>
                    <th>Target</th>
                    <th>Notification Details</th>
                    <th>Status</th>
                    <th>Date</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="notifyTableBody">
                <!-- Dynamic Content -->
            </tbody>
        </table>
    </section>
</div>
