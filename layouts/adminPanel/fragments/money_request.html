<div class="money-request-page">
    <header class="page-header">
        <h1>💸 Money Request Management</h1>
        <button class="add-btn" id="toggleRequestForm">➕ New Request (Admin Entry)</button>
    </header>

    <!-- CREATE REQUEST FORM (Admin can also entry) -->
    <section class="form-section" id="requestFormSection"
        style="display: none; margin-bottom: 20px; padding: 20px; background: #f9f9f9; border-radius: 8px;">
        <h3>Create New Money Request</h3>
        <form id="moneyRequestForm">
            <div class="form-grid"
                style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px;">
                <div class="form-group">
                    <label>User ID</label>
                    <input type="number" name="userId" required placeholder="Enter User ID">
                </div>
                <div class="form-group">
                    <label>Request Type</label>
                    <select name="type" required>
                        <option value="deposit">Deposit (ক্যাশ ইন)</option>
                        <option value="withdraw">Withdraw (ক্যাশ আউট)</option>
                        <option value="recharge">Recharge (মোবাইল রিচার্জ)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Payment Method</label>
                    <input type="text" name="paymentMethod" required placeholder="e.g. bKash, Nagad">
                </div>
                <div class="form-group">
                    <label>Amount</label>
                    <input type="number" name="amount" required placeholder="0.00">
                </div>
                <div class="form-group">
                    <label>Transaction ID (Optional)</label>
                    <input type="text" name="transactionId" placeholder="TRX123456">
                </div>
                <div class="form-group">
                    <label>Receipt Image (Optional)</label>
                    <input type="file" name="recitImage" accept="image/*">
                </div>
            </div>
            <div style="margin-top: 15px;">
                <button type="submit" class="submit-btn"
                    style="background: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer;">🚀
                    Submit Request</button>
                <button type="button" id="cancelForm"
                    style="background: #666; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer;">Cancel</button>
            </div>
        </form>
    </section>

    <!-- TABLE SECTION -->
    <section class="table-section">
        <table class="money-request-table">
            <thead>
                <tr>
                    <th>User Info</th>
                    <th>Type</th> <!-- নতুন কলাম -->
                    <th>Method</th>
                    <th>Amount</th>
                    <th>TrxID</th>
                    <th>Receipt</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="requestTableBody">
                <!-- Dynamic Data -->
            </tbody>
        </table>
    </section>

    <!-- RECEIPT MODAL -->
    <div id="receiptModal"
        style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:1000; justify-content:center; align-items:center;">
        <div style="position:relative; background:#fff; padding:10px; border-radius:8px;">
            <span id="closeModal"
                style="position:absolute; top:-15px; right:-15px; background:red; color:#fff; cursor:pointer; padding:5px 10px; border-radius:50%;">X</span>
            <img id="modalImg" src="" style="max-width:90vw; max-height:90vh; border-radius:4px;">
        </div>
    </div>
</div>
