<div class="auth-container">

  <!-- AUTH CARD -->
  <div class="auth-card">

    <!-- HEADER -->
    <header class="auth-header">
      <h1 class="auth-title">Trust Money</h1>
      <p class="auth-subtitle">Secure access to your account</p>
    </header>

    <!-- TAB NAVIGATION -->
    <nav class="auth-tabs">
      <button class="tab-btn" onclick="location.hash = 'login'">Login</button>
      <button class="tab-btn" onclick="location.hash = 'register'">Register</button>
    </nav>

    <!-- CONTENT AREA (DYNAMIC FRAGMENT LOAD) -->
    <main id="content" class="auth-content">
      <h1 class="placeholder-text">No fragment selected</h1>
    </main>

  </div>

</div>
