<div class="register-form">

  <h2>📝 Create Account</h2>

  <!-- COUNTRY -->
  <div class="form-group">
    <label>Country</label>
    <input type="text" id="countryName" value="Bangladesh" readonly />
  </div>

  <!-- NAME ROW -->
  <div class="form-row">
    <div class="form-group">
      <label>First Name</label>
      <input type="text" id="firstName" placeholder="Enter first name" />
    </div>

    <div class="form-group">
      <label>Last Name</label>
      <input type="text" id="lastName" placeholder="Enter last name" />
    </div>
  </div>

  <!-- CONTACT -->
  <div class="form-group">
    <label>Phone Number</label>
    <input type="tel" id="phone" placeholder="e.g. 017XXXXXXXX" />
  </div>

  <div class="form-group">
    <label>Email Address</label>
    <input type="email" id="email" placeholder="example@email.com" />
  </div>

  <!-- PASSWORD -->
  <div class="form-group">
    <label>Password</label>
    <input type="password" id="password" placeholder="Enter secure password" />
  </div>

  <!-- DOB -->
  <div class="form-group">
    <label>Date of Birth</label>
    <input type="date" id="dateOfBirth" />
  </div>

  <!-- HIDDEN -->
  <input type="hidden" id="role" value="admin" />
  <input type="hidden" id="status" value="personal" />

  <!-- ACTION -->
  <div class="form-actions">
    <button id="registerBtn">🚀 Create Account</button>
  </div>

</div>
